<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <title>Edit Doctor</title>
</head>
<body>

<div th:replace="navigation :: navigation"></div>

<div class="page-wrapper">
    <div class="page-card">
        <div class="page-header">
            <h2>Edit Doctor</h2>
            <p>Update the details for this doctor</p>
        </div>

        <div class="alert-message" th:if="${message}" th:text="${message}"></div>

        <form th:action="@{/edit/doctor/{id}(id=${doctors.id})}" method="post" class="login-form">
            <input type="hidden" name="_method" value="put"/>
            <div class="form-row">
                <div class="form-group">
                    <label for="doctorName">Name</label>
                    <input type="text" id="doctorName" name="doctorName" th:value="${doctors.doctorName}" required>
                </div>
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" th:value="${doctors.age}" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="specialization">Specialization</label>
                    <input type="text" id="specialization" name="specialization" th:value="${doctors.specialization}" required>
                </div>
                <div class="form-group">
                    <label for="qualification">Qualification</label>
                    <input type="text" id="qualification" name="qualification" th:value="${doctors.qualification}" required>
                </div>
            </div>
            <div class="form-group">
                <label for="experience">Experience</label>
                <input type="text" id="experience" name="experience" th:value="${doctors.experience}" required>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                <button type="submit" class="login-btn">Update Doctor</button>
                <a th:href="@{/doctors}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
