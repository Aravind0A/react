<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <title>Appointments</title>
</head>
<body>

<div th:replace="navigation :: navigation"></div>

<div class="page-wrapper">
    <div class="page-card">
        <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h2>Appointments</h2>
                <p>Filter appointments by date</p>
            </div>
            <form th:action="@{/appointments}" method="get" style="display: flex; gap: 8px; align-items: center;">
                <input type="date" name="keyword" th:value="${keyword}"
                       style="padding: 8px 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; outline: none; color: #1a1a2e;"/>
                <button type="submit" class="btn-primary">Search</button>
                <a th:href="@{/appointments}" class="btn-cancel">Clear</a>
            </form>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Doctor</th>
                    <th>Appointment Date</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="3" style="text-align: center; color: #888; padding: 2rem;">
                        No appointments found
                    </td>
                </tr>
                <tr th:each="appointment, i : ${appointments}">
                    <td th:text="${i.count}"></td>
                    <td th:text="${appointment.doctors?.doctorName}"></td>
                    <td th:text="${appointment.appointmentDate}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
