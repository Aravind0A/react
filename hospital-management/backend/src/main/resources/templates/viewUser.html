<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <title>View User</title>
</head>
<body>

<div th:replace="navigation :: navigation"></div>

<div class="page-wrapper">
    <div class="page-card">

        <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h2 th:text="${user.name}">User</h2>
                <p th:text="${user.email}"></p>
            </div>
            <a th:href="@{/users}" class="btn-cancel">Back</a>
        </div>

        <div th:if="${#lists.isEmpty(appointments)}" class="alert-message">
            No appointments found for this user.
        </div>

        <table class="data-table" th:unless="${#lists.isEmpty(appointments)}">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Doctor</th>
                    <th>Appointment Date</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="appointment, i : ${appointments}">
                    <td th:text="${i.count}"></td>
                    <td th:text="${appointment.doctors?.doctorName}"></td>
                    <td th:text="${appointment.appointmentDate}"></td>
                </tr>
            </tbody>
        </table>

    </div>
</div>

</body>
</html>
